name: Genera e Aggiorna Feed RSS AlboPop

on:
  schedule:
    - cron: '0 */4 * * *' # Esegue automaticamente ogni 4 ore
  workflow_dispatch:      # Ti permette di avviarlo manualmente dai Actions di GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permette ad GitHub Actions di scrivere il file feed.xml nel repo
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Esecuzione script feed
        run: |
          python albo_feed.py --senza-upload

      - name: Commit e push automatico del feed.xml nel repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornamento automatico RSS feed.xml" && git push)
